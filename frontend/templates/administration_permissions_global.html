{% load static %}<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDRDOC-SCAN — Gestion des permissions</title><link rel="stylesheet" href="{% static 'css/app.css' %}"><link rel="stylesheet" href="{% static 'css/institutional.css' %}"><script src="{% static 'js/theme.js' %}"></head><body><div class="console"><aside class="rail"><div class="rail-brand"><div class="brand"><span class="brand-mark">TDRDOC-SCAN</span></div></div><nav class="rail-nav"><a class="rail-link" href="{% url 'detector:dashboard' %}"><span class="ico">▦</span><span>Tableau de bord</span></a><a class="rail-link" href="{% url 'detector:reception' %}"><span class="ico">✓</span><span>Vérifier un TDR</span></a><a class="rail-link" href="{% url 'detector:analyser' %}"><span class="ico">+</span><span>Nouvelle analyse</span></a><a class="rail-link" href="{% url 'detector:resultats' %}"><span class="ico">◷</span><span>Historique</span></a><div class="rail-admin-menu"><div class="rail-link active"><span class="ico">◆</span><span>Administration</span><span class="admin-chevron">⌄</span></div><div class="rail-subnav"><a href="{% url 'detector:administration_roles' %}">Gestion des rôles</a><a href="{% url 'detector:administration_users' %}">Gestion des utilisateurs</a><a class="active" href="{% url 'detector:administration_permissions' %}">Gestion des permissions</a></div></div></nav><div class="rail-foot"><div class="rail-user"><strong>{{ request.user.get_full_name|default:request.user.username }}</strong><small>Session active</small></div><a class="rail-logout" href="{% url 'detector:logout' %}">Déconnexion</a></div></aside><main class="main"><div class="ctxbar"><div><h1>Gestion des permissions</h1><div class="lede">Définissez les permissions fonctionnelles de chaque rôle.</div></div></div><div class="page-pad admin-page">{% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}<section class="panel admin-section"><div class="panel-head"><div><h2>Permissions par rôle</h2><div class="muted admin-help">Cochez les fonctionnalités autorisées puis enregistrez le rôle.</div></div></div><div class="panel-body">{% for role in roles %}<div class="card" style="margin-bottom:14px"><h3>{{ role.name }}</h3><form method="post" class="permission-list">{% csrf_token %}<input type="hidden" name="group_id" value="{{ role.id }}">{% for permission in permissions %}<label class="permission-item"><input type="checkbox" name="permissions" value="{{ permission.codename }}" {% if permission in role.permissions.all %}checked{% endif %}><span>{{ permission.name }}</span></label>{% empty %}<p class="muted">Aucune permission fonctionnelle disponible.</p>{% endfor %}<button class="btn btn-primary" type="submit" style="margin-top:12px">Enregistrer les permissions</button></form></div>{% empty %}<p class="muted">Aucun rôle n'est encore créé.</p>{% endfor %}</div></section></div></main></div></body></html>
