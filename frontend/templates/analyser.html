{% load static %}<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouvelle analyse</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body><header><b>DOC<span>SEC</span></b><nav><a href="{% url 'detector:dashboard' %}">Tableau de bord</a><a href="{% url 'detector:analyser' %}">Nouvelle analyse</a><a href="{% url 'detector:resultats' %}">Historique</a></nav></header><main><section class="hero"><small>NOUVELLE ANALYSE</small><h1>Soumettre un document</h1><p>Choisissez le moteur correspondant au type de document.</p></section>{% if messages %}{% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}{% endif %}<form class="card form" method="post" enctype="multipart/form-data">{% csrf_token %}<label>Type d'analyse<select name="mode"><option value="plagiarism">Plagiat — Rapport d'étude</option><option value="duplicate">Doublon — TDR</option></select></label><label>Document DOCX<input type="file" name="document" accept=".docx" required></label><button class="button" type="submit">Lancer l'analyse</button></form></main></body></html>
