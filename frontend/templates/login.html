{% load static %}
<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOCSEC — Connexion</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body class="auth-page"><main class="auth-wrap"><section class="auth-card"><div class="brand">DOC<span>SEC</span></div><small>PLATEFORME SÉCURISÉE D'ANALYSE DOCUMENTAIRE</small><h1>Bienvenue</h1><p class="muted">Connectez-vous pour accéder au tableau de bord et aux outils de vérification.</p><form method="post" class="form">{% csrf_token %}{% if form.non_field_errors %}<div class="alert">{{ form.non_field_errors }}</div>{% endif %}<label>{{ form.username.label }}{{ form.username }}{% for error in form.username.errors %}<small class="error">{{ error }}</small>{% endfor %}</label><label>{{ form.password.label }}{{ form.password }}{% for error in form.password.errors %}<small class="error">{{ error }}</small>{% endfor %}</label><button class="button" type="submit">Se connecter</button></form></section></main></body></html>
