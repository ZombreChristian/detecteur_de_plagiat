{% load static %}<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDRDOC-SCAN — Gestion des utilisateurs</title><link rel="stylesheet" href="{% static 'css/app.css' %}"><link rel="stylesheet" href="{% static 'css/institutional.css' %}"><script src="{% static 'js/theme.js' %}"></head><body><div class="console"><aside class="rail"><div class="rail-brand"><div class="brand"><span class="brand-mark">TDRDOC-SCAN</span></div></div><nav class="rail-nav"><a class="rail-link" href="{% url 'detector:dashboard' %}"><span class="ico">▦</span><span>Tableau de bord</span></a><a class="rail-link" href="{% url 'detector:reception' %}"><span class="ico">✓</span><span>Vérifier un TDR</span></a><a class="rail-link" href="{% url 'detector:analyser' %}"><span class="ico">+</span><span>Nouvelle analyse</span></a><a class="rail-link" href="{% url 'detector:resultats' %}"><span class="ico">◷</span><span>Historique</span></a><div class="rail-admin-menu"><div class="rail-link active"><span class="ico">◆</span><span>Administration</span><span class="admin-chevron">⌄</span></div><div class="rail-subnav"><a href="{% url 'detector:administration_roles' %}">Gestion des rôles</a><a class="active" href="{% url 'detector:administration_users' %}">Gestion des utilisateurs</a><a href="{% url 'detector:administration_permissions' %}">Gestion des permissions</a></div></div></nav><div class="rail-foot"><div class="rail-user"><strong>{{ request.user.get_full_name|default:request.user.username }}</strong><small>Session active</small></div><a class="rail-logout" href="{% url 'detector:logout' %}">Déconnexion</a></div></aside><main class="main"><div class="ctxbar"><div><h1>Gestion des utilisateurs</h1><div class="lede">Créez, recherchez et consultez les comptes utilisateurs.</div></div></div><div class="page-pad admin-page">{% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}<section class="panel admin-section"><div class="panel-head"><div><h2>Ajouter un utilisateur</h2></div></div><div class="panel-body"><form method="post" class="admin-form">{% csrf_token %}{{ create_user_form.as_p }}<label>Rôle initial</label><select name="group_id"><option value="">Aucun rôle</option>{% for role in roles %}<option value="{{ role.id }}">{{ role.name }}</option>{% endfor %}</select><button class="btn btn-primary" type="submit">Créer l'utilisateur</button></form></div></section><section class="panel admin-section"><div class="panel-head"><div><h2>Liste des utilisateurs</h2></div></div><div class="panel-body"><form method="get" class="admin-search"><input type="search" name="q" value="{{ q }}" placeholder="Rechercher un utilisateur"><button class="btn" type="submit">Rechercher</button></form><div class="admin-table-wrap" style="margin-top:14px"><table class="ledger"><thead><tr><th>Utilisateur</th><th>État</th><th>Rôle</th><th>Permissions directes</th><th>Action</th></tr></thead><tbody>{% for user in users %}<tr><td><strong>{{ user.username }}</strong><div class="doc-meta">{{ user.email|default:'—' }}</div></td><td>{% if user.is_active %}<span class="status status-ok">Actif</span>{% else %}<span class="status status-alert">Inactif</span>{% endif %}</td><td>{% for role in user.groups.all %}<span class="status status-neutral">{{ role.name }}</span>{% empty %}<span class="muted">Aucun rôle</span>{% endfor %}</td><td><span class="status status-neutral">{{ user.user_permissions.count }}</span></td><td><a class="btn btn-primary" href="{% url 'detector:administration_utilisateur' user.id %}">Gérer</a></td></tr>{% empty %}<tr><td colspan="5" class="ledger-empty">Aucun utilisateur.</td></tr>{% endfor %}</tbody></table></div></div></section></div></main></div></body></html>
