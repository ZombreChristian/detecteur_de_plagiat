{% load static %}<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDRDOC-SCAN — Gestion des rôles</title><link rel="stylesheet" href="{% static 'css/app.css' %}"><link rel="stylesheet" href="{% static 'css/institutional.css' %}"><script src="{% static 'js/theme.js' %}"></head><body><div class="console"><aside class="rail"><div class="rail-brand"><div class="brand"><span class="brand-mark">TDRDOC-SCAN</span></div></div><nav class="rail-nav"><a class="rail-link" href="{% url 'detector:dashboard' %}"><span class="ico">▦</span><span>Tableau de bord</span></a><a class="rail-link" href="{% url 'detector:reception' %}"><span class="ico">✓</span><span>Vérifier un TDR</span></a><a class="rail-link" href="{% url 'detector:analyser' %}"><span class="ico">+</span><span>Nouvelle analyse</span></a><a class="rail-link" href="{% url 'detector:resultats' %}"><span class="ico">◷</span><span>Historique</span></a><div class="rail-admin-menu"><div class="rail-link active"><span class="ico">◆</span><span>Administration</span><span class="admin-chevron">⌄</span></div><div class="rail-subnav"><a class="active" href="{% url 'detector:administration_roles' %}">Gestion des rôles</a><a href="{% url 'detector:administration_users' %}">Gestion des utilisateurs</a><a href="{% url 'detector:administration_permissions' %}">Gestion des permissions</a></div></div></nav><div class="rail-foot"><div class="rail-user"><strong>{{ request.user.get_full_name|default:request.user.username }}</strong><small>Session active</small></div><a class="rail-logout" href="{% url 'detector:logout' %}">Déconnexion</a></div></aside><main class="main"><div class="ctxbar"><div><h1>Gestion des rôles</h1><div class="lede">Consultez les rôles existants et créez les rôles nécessaires à votre organisation.</div></div><div class="actions"><a class="btn" href="{% url 'detector:administration' %}">Administration</a></div></div><div class="page-pad admin-page">{% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}<section class="panel admin-section"><div class="panel-head"><div><h2>Ajouter un nouveau rôle</h2></div></div><div class="panel-body"><form method="post" class="admin-form" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">{% csrf_token %}<div><label>Nom du rôle</label><input name="role_name" placeholder="Ex. Analyste TDR" required></div><button class="btn btn-primary" type="submit">Ajouter le rôle</button></form></div></section><section class="panel admin-section"><div class="panel-head"><div><h2>Rôles existants</h2><div class="muted admin-help">{{ admin_roles_count }} rôle(s) enregistré(s).</div></div></div><div class="panel-body"><div class="admin-role-grid">{% for role in roles %}<div class="card admin-role-card"><strong>{{ role.name }}</strong><span>{{ role.user_set.count }} utilisateur(s) · {{ role.permissions.count }} permission(s)</span><div style="margin-top:12px">{% if role.name != 'Administrateur' and role.name != 'Utilisateur' %}<form method="post" action="{% url 'detector:administration_role_delete' role.id %}" onsubmit="return confirm('Supprimer ce rôle ?');"><button class="btn" type="submit">Supprimer</button></form>{% else %}<span class="muted">Rôle système</span>{% endif %}</div></div>{% empty %}<div class="ledger-empty">Aucun rôle.</div>{% endfor %}</div></div></section></div></main></div></body></html>
